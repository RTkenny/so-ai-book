<svg xmlns="http://www.w3.org/2000/svg" width="800" height="385" viewBox="0 0 800 385" role="img"><title>库存系统的一次状态转移</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#3567ad"/></marker></defs><rect width="800" height="385" rx="14" fill="#f7f9fc"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="40" text-anchor="start" font-size="25" fill="#263b54" font-weight="600">库存系统的一次状态转移</text><text x="32" y="70" text-anchor="start" font-size="16" fill="#6a7d92" font-weight="400">先补货，再发生需求；状态限定在 Q 表表示的范围内。</text><rect x="35" y="128" width="152" height="86" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5"/><text x="111.0" y="169.0" text-anchor="middle" font-size="21" fill="#3567ad" font-weight="600">当前库存</text><text x="111.0" y="197.0" text-anchor="middle" font-size="15" fill="#6a7d92" font-weight="400">sₜ</text><rect x="230" y="128" width="152" height="86" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5"/><text x="306.0" y="169.0" text-anchor="middle" font-size="21" fill="#3567ad" font-weight="600">订货</text><text x="306.0" y="197.0" text-anchor="middle" font-size="15" fill="#6a7d92" font-weight="400">+ aₜ</text><rect x="425" y="128" width="152" height="86" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5"/><text x="501.0" y="169.0" text-anchor="middle" font-size="21" fill="#3567ad" font-weight="600">随机需求</text><text x="501.0" y="197.0" text-anchor="middle" font-size="15" fill="#6a7d92" font-weight="400">− Dₜ</text><rect x="620" y="128" width="145" height="86" rx="9" fill="white" stroke="#387b6b" stroke-opacity=".5" stroke-width="1.5"/><text x="692.5" y="169.0" text-anchor="middle" font-size="21" fill="#387b6b" font-weight="600">下期库存</text><text x="692.5" y="197.0" text-anchor="middle" font-size="15" fill="#6a7d92" font-weight="400">sₜ₊₁</text><path d="M188 171L220 171" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M383 171L415 171" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M578 171L610 171" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="400" y="269" text-anchor="middle" font-size="25" fill="#3567ad" font-weight="400">sₜ₊₁ = clip(sₜ + aₜ − Dₜ, −20, 20)</text><text x="400" y="312" text-anchor="middle" font-size="20" fill="#263b54" font-weight="400">库存为正：持有成本    ·    库存为负：缺货成本</text><text x="400" y="345" text-anchor="middle" font-size="18" fill="#6a7d92" font-weight="400">本期奖励 = −（订货成本 + 持有成本 + 缺货成本）</text></g></svg>