<svg xmlns="http://www.w3.org/2000/svg" width="800" height="385" viewBox="0 0 800 385" role="img" lang="en"><title>One inventory state transition</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#3567ad" /></marker></defs><rect width="800" height="385" rx="14" fill="#f7f9fc" /><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="40" text-anchor="start" font-size="25.0" fill="#263b54" font-weight="600">One inventory state transition</text><text x="32" y="70" text-anchor="start" font-size="16.0" fill="#6a7d92" font-weight="400">Replenish, observe demand, then clip the state to the Q-table range.</text><rect x="35" y="128" width="152" height="86" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5" /><text x="111.0" y="169.0" text-anchor="middle" font-size="21.0" fill="#3567ad" font-weight="600">Inventory</text><text x="111.0" y="197.0" text-anchor="middle" font-size="15" fill="#6a7d92" font-weight="400">sₜ</text><rect x="230" y="128" width="152" height="86" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5" /><text x="306.0" y="169.0" text-anchor="middle" font-size="21.0" fill="#3567ad" font-weight="600">Order</text><text x="306.0" y="197.0" text-anchor="middle" font-size="15" fill="#6a7d92" font-weight="400">+ aₜ</text><rect x="425" y="128" width="152" height="86" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5" /><text x="501.0" y="169.0" text-anchor="middle" font-size="21.0" fill="#3567ad" font-weight="600">Demand</text><text x="501.0" y="197.0" text-anchor="middle" font-size="15" fill="#6a7d92" font-weight="400">− Dₜ</text><rect x="620" y="128" width="145" height="86" rx="9" fill="white" stroke="#387b6b" stroke-opacity=".5" stroke-width="1.5" /><text x="692.5" y="169.0" text-anchor="middle" font-size="15.8" fill="#387b6b" font-weight="600">Next inventory</text><text x="692.5" y="197.0" text-anchor="middle" font-size="15" fill="#6a7d92" font-weight="400">sₜ₊₁</text><path d="M188 171L220 171" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M383 171L415 171" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M578 171L610 171" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="400" y="269" text-anchor="middle" font-size="25" fill="#3567ad" font-weight="400">sₜ₊₁ = clip(sₜ + aₜ − Dₜ, −20, 20)</text><text x="400" y="312" text-anchor="middle" font-size="20.0" fill="#263b54" font-weight="400">Positive inventory: holding cost · Negative inventory: shortage cost</text><text x="400" y="345" text-anchor="middle" font-size="18.0" fill="#6a7d92" font-weight="400">Reward = −(ordering cost + holding cost + shortage cost)</text></g></svg>
