<svg xmlns="http://www.w3.org/2000/svg" width="800" height="365" viewBox="0 0 800 365" role="img" lang="en"><title>Common random numbers: share the same jobs</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#3567ad" /></marker></defs><rect width="800" height="365" rx="14" fill="#f7f9fc" /><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="40" text-anchor="start" font-size="25.0" fill="#263b54" font-weight="600">Common random numbers: share the same jobs</text><text x="32" y="70" text-anchor="start" font-size="16.0" fill="#6a7d92" font-weight="400">Compute paired cost differences, then a confidence interval for their mean.</text><rect x="35" y="155" width="186" height="94" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5" /><text x="128.0" y="200.0" text-anchor="middle" font-size="16.5" fill="#3567ad" font-weight="600">Shared sample path</text><text x="128.0" y="228.0" text-anchor="middle" font-size="11.6" fill="#6a7d92" font-weight="400">Arrivals + processing times</text><rect x="305" y="105" width="170" height="83" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5" /><text x="390.0" y="144.5" text-anchor="middle" font-size="21.0" fill="#3567ad" font-weight="600">Design A</text><text x="390.0" y="172.5" text-anchor="middle" font-size="15.0" fill="#6a7d92" font-weight="400">3 machines</text><rect x="305" y="245" width="170" height="83" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5" /><text x="390.0" y="284.5" text-anchor="middle" font-size="21.0" fill="#3567ad" font-weight="600">Design B</text><text x="390.0" y="312.5" text-anchor="middle" font-size="15.0" fill="#6a7d92" font-weight="400">4 machines</text><path d="M222 190L295 148" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M222 214L295 285" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="573" y="168" width="191" height="94" rx="9" fill="white" stroke="#387b6b" stroke-opacity=".5" stroke-width="1.5" /><text x="668.5" y="213.0" text-anchor="middle" font-size="14.0" fill="#387b6b" font-weight="600">Paired cost difference</text><text x="668.5" y="241.0" text-anchor="middle" font-size="15" fill="#6a7d92" font-weight="400">D = C(3) − C(4)</text><path d="M476 148L564 199" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M476 285L564 233" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /></g></svg>
