<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" lang="en"><title>Production capacity: machines or waiting?</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#3567ad" /></marker></defs><rect width="800" height="440" rx="14" fill="#f7f9fc" /><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="40" text-anchor="start" font-size="25.0" fill="#263b54" font-weight="600">Production capacity: machines or waiting?</text><text x="32" y="70" text-anchor="start" font-size="16.0" fill="#6a7d92" font-weight="400">Fix a sample path of jobs, then compare different machine counts.</text><rect x="32" y="185" width="138" height="86" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5" /><text x="101.0" y="226.0" text-anchor="middle" font-size="18.5" fill="#3567ad" font-weight="600">Job arrivals</text><text x="101.0" y="254.0" text-anchor="middle" font-size="15" fill="#6a7d92" font-weight="400">Poisson arrivals</text><rect x="216" y="185" width="150" height="86" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5" /><text x="291.0" y="226.0" text-anchor="middle" font-size="21.0" fill="#3567ad" font-weight="600">FCFS queue</text><text x="291.0" y="254.0" text-anchor="middle" font-size="10.2" fill="#6a7d92" font-weight="400">First come, first served</text><path d="M171 227L208 227" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="438" y="114" width="144" height="68" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5" /><text x="510.0" y="155.0" text-anchor="middle" font-size="21.0" fill="#3567ad" font-weight="600">Machine 1</text><path d="M366 227L429 148" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M583 148L640 227" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="438" y="205" width="144" height="68" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5" /><text x="510.0" y="246.0" text-anchor="middle" font-size="21.0" fill="#3567ad" font-weight="600">Machine 2</text><path d="M366 227L429 239" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M583 239L640 227" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="438" y="296" width="144" height="68" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5" /><text x="510.0" y="337.0" text-anchor="middle" font-size="21.0" fill="#3567ad" font-weight="600">Machine 3</text><path d="M366 227L429 330" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M583 330L640 227" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="649" y="185" width="120" height="86" rx="9" fill="white" stroke="#387b6b" stroke-opacity=".5" stroke-width="1.5" /><text x="709.0" y="226.0" text-anchor="middle" font-size="16.5" fill="#387b6b" font-weight="600">Completions</text><text x="709.0" y="254.0" text-anchor="middle" font-size="10.7" fill="#6a7d92" font-weight="400">Waiting + lateness</text><text x="400" y="407" text-anchor="middle" font-size="21.0" fill="#263b54" font-weight="400">Total cost = machine cost + waiting cost + late-job penalties</text></g></svg>
