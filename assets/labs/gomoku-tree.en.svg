<svg xmlns="http://www.w3.org/2000/svg" width="800" height="475" viewBox="0 0 800 475" role="img" lang="en"><title>Explore future moves as a tree</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#3567ad" /></marker></defs><rect width="800" height="475" rx="14" fill="#f7f9fc" /><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="40" text-anchor="start" font-size="25.0" fill="#263b54" font-weight="600">Explore future moves as a tree</text><text x="32" y="70" text-anchor="start" font-size="16.0" fill="#6a7d92" font-weight="400">Blue highlights the selected branch. This is a schematic, not a game result.</text><rect x="295" y="108" width="210" height="67" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5" /><text x="400.0" y="148.5" text-anchor="middle" font-size="21.0" fill="#3567ad" font-weight="600">Current position</text><path d="M400 176L165 224" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="80" y="237" width="170" height="65" rx="9" fill="white" stroke="#6a7d92" stroke-opacity=".5" stroke-width="1.5" /><text x="165.0" y="276.5" text-anchor="middle" font-size="21.0" fill="#6a7d92" font-weight="600">Move A</text><path d="M400 176L400 224" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="315" y="237" width="170" height="65" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5" /><text x="400.0" y="276.5" text-anchor="middle" font-size="21.0" fill="#3567ad" font-weight="600">Move B</text><path d="M400 176L635 224" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="550" y="237" width="170" height="65" rx="9" fill="white" stroke="#6a7d92" stroke-opacity=".5" stroke-width="1.5" /><text x="635.0" y="276.5" text-anchor="middle" font-size="21.0" fill="#6a7d92" font-weight="600">Move C</text><path d="M400 303L319 354" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M400 303L500 354" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5" /><rect x="230" y="366" width="175" height="65" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5" /><text x="317.5" y="405.5" text-anchor="middle" font-size="17.6" fill="#3567ad" font-weight="600">Existing position</text><rect x="453" y="366" width="208" height="65" rx="9" fill="white" stroke="#bc7535" stroke-opacity=".5" stroke-width="1.5" /><text x="557.0" y="405.5" text-anchor="middle" font-size="19.8" fill="#bc7535" font-weight="600">Expand a new node</text><text x="400" y="458" text-anchor="middle" font-size="18.0" fill="#6a7d92" font-weight="400">Select: mean reward + exploration bonus → expand → simulate</text></g></svg>
