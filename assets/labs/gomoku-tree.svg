roke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="230" y="366" width="175" height="65" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5"/><text x="317.5" y="405.5" text-anchor="middle" font-size="21" fill="#3567ad" font-weight="600">已有后续局面</text><rect x="453" y="366" width="208" height="65" rx="9" fill="white" stroke="#bc7535" stroke-opacity=".5" stroke-width="1.5"/><text x="557.0" y="405.5" text-anchor="middle" font-size="21" fill="#bc7535" font-weight="600">扩展新节点</text><text x="400" y="458" text-anchor="middle" font-size="18" fill="#6a7d92" font-weight="400">选择：平均收益 + 探索奖励    →    扩展    →    模拟后续对局</text></g></svg>