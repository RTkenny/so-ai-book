<svg xmlns="http://www.w3.org/2000/svg" width="800" height="435" viewBox="0 0 800 435" role="img" lang="en"><title>The four phases of MCTS</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#3567ad" /></marker></defs><rect width="800" height="435" rx="14" fill="#f7f9fc" /><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="40" text-anchor="start" font-size="25.0" fill="#263b54" font-weight="600">The four phases of MCTS</text><text x="32" y="70" text-anchor="start" font-size="16.0" fill="#6a7d92" font-weight="400">Repeat until the simulation budget for the current move is exhausted.</text><rect x="62" y="111" width="260" height="90" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5" /><text x="192.0" y="154.0" text-anchor="middle" font-size="21.0" fill="#3567ad" font-weight="600">01  Selection</text><text x="192.0" y="182.0" text-anchor="middle" font-size="15.0" fill="#6a7d92" font-weight="400">Follow UCT down the tree</text><rect x="478" y="111" width="260" height="90" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5" /><text x="608.0" y="154.0" text-anchor="middle" font-size="21.0" fill="#3567ad" font-weight="600">02  Expansion</text><text x="608.0" y="182.0" text-anchor="middle" font-size="15.0" fill="#6a7d92" font-weight="400">Add one untried move</text><rect x="478" y="260" width="260" height="90" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5" /><text x="608.0" y="303.0" text-anchor="middle" font-size="21.0" fill="#3567ad" font-weight="600">03  Simulation</text><text x="608.0" y="331.0" text-anchor="middle" font-size="13.5" fill="#6a7d92" font-weight="400">Play randomly to a terminal result</text><rect x="62" y="260" width="260" height="90" rx="9" fill="white" stroke="#387b6b" stroke-opacity=".5" stroke-width="1.5" /><text x="192.0" y="303.0" text-anchor="middle" font-size="21.0" fill="#387b6b" font-weight="600">04  Backpropagation</text><text x="192.0" y="331.0" text-anchor="middle" font-size="11.9" fill="#6a7d92" font-weight="400">Update visits and rewards on the path</text><path d="M323 156L465 156" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M607 202L607 246" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M465 305L334 305" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M192 258L192 215" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="400" y="401" text-anchor="middle" font-size="21.0" fill="#3567ad" font-weight="400">Final choice: the most visited move at the root</text></g></svg>
