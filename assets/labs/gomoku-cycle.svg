<svg xmlns="http://www.w3.org/2000/svg" width="800" height="435" viewBox="0 0 800 435" role="img"><title>MCTS 的四个步骤</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#3567ad"/></marker></defs><rect width="800" height="435" rx="14" fill="#f7f9fc"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="40" text-anchor="start" font-size="25" fill="#263b54" font-weight="600">MCTS 的四个步骤</text><text x="32" y="70" text-anchor="start" font-size="16" fill="#6a7d92" font-weight="400">反复执行，直到用完本次落子的模拟预算。</text><rect x="62" y="111" width="260" height="90" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5"/><text x="192.0" y="154.0" text-anchor="middle" font-size="21" fill="#3567ad" font-weight="600">01  选择</text><text x="192.0" y="182.0" text-anchor="middle" font-size="15" fill="#6a7d92" font-weight="400">根据 UCT 沿树向下</text><rect x="478" y="111" width="260" height="90" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5"/><text x="608.0" y="154.0" text-anchor="middle" font-size="21" fill="#3567ad" font-weight="600">02  扩展</text><text x="608.0" y="182.0" text-anchor="middle" font-size="15" fill="#6a7d92" font-weight="400">加入一个尚未尝试的走法</text><rect x="478" y="260" width="260" height="90" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5"/><text x="608.0" y="303.0" text-anchor="middle" font-size="21" fill="#3567ad" font-weight="600">03  模拟</text><text x="608.0" y="331.0" text-anchor="middle" font-size="15" fill="#6a7d92" font-weight="400">随机走到终局，得到胜负</text><rect x="62" y="260" width="260" height="90" rx="9" fill="white" stroke="#387b6b" stroke-opacity=".5" stroke-width="1.5"/><text x="192.0" y="303.0" text-anchor="middle" font-size="21" fill="#387b6b" font-weight="600">04  回传</text><text x="192.0" y="331.0" text-anchor="middle" font-size="15" fill="#6a7d92" font-weight="400">沿途更新访问次数与收益</text><path d="M323 156L465 156" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M607 202L607 246" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M465 305L334 305" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M192 258L192 215" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="400" y="401" text-anchor="middle" font-size="21" fill="#3567ad" font-weight="400">最终选择：根节点下访问次数最多的走法</text></g></svg>