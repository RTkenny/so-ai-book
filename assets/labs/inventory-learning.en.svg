<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" role="img" lang="en"><title>Q-learning: learn through simulation</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#3567ad" /></marker></defs><rect width="800" height="390" rx="14" fill="#f7f9fc" /><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="40" text-anchor="start" font-size="25.0" fill="#263b54" font-weight="600">Q-learning: learn through simulation</text><text x="32" y="70" text-anchor="start" font-size="16.0" fill="#6a7d92" font-weight="400">Learn during training; freeze the Q-table and use fresh demand for evaluation.</text><rect x="70" y="115" width="245" height="85" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5" /><text x="192.5" y="155.5" text-anchor="middle" font-size="19.3" fill="#3567ad" font-weight="600">01  Observe inventory</text><text x="192.5" y="183.5" text-anchor="middle" font-size="12.9" fill="#6a7d92" font-weight="400">Find the state row in the Q-table</text><rect x="485" y="115" width="245" height="85" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5" /><text x="607.5" y="155.5" text-anchor="middle" font-size="21.0" fill="#3567ad" font-weight="600">02  Choose an order</text><text x="607.5" y="183.5" text-anchor="middle" font-size="15.0" fill="#6a7d92" font-weight="400">Epsilon-greedy exploration</text><rect x="485" y="263" width="245" height="85" rx="9" fill="white" stroke="#3567ad" stroke-opacity=".5" stroke-width="1.5" /><text x="607.5" y="303.5" text-anchor="middle" font-size="21.0" fill="#3567ad" font-weight="600">03  Simulate demand</text><text x="607.5" y="331.5" text-anchor="middle" font-size="13.6" fill="#6a7d92" font-weight="400">Observe reward and next state</text><rect x="70" y="263" width="245" height="85" rx="9" fill="white" stroke="#387b6b" stroke-opacity=".5" stroke-width="1.5" /><text x="192.5" y="303.5" text-anchor="middle" font-size="21.0" fill="#387b6b" font-weight="600">04  Update Q-values</text><text x="192.5" y="331.5" text-anchor="middle" font-size="11.0" fill="#6a7d92" font-weight="400">Update the selected state–action pair</text><path d="M316 157L473 157" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M607 201L607 251" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M474 305L326 305" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M192 262L192 211" stroke="#3567ad" stroke-width="2" fill="none" marker-end="url(#arrow)" /></g></svg>
